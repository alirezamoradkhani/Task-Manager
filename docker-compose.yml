services:
  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping: 1})"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-task_manager}
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/mongodb')"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
