services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: task
      POSTGRES_PASSWORD: task
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task -d task_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://task:task@db:5432/task_manager
      MONGODB_URL: ${MONGODB_URL:-mongodb://host.docker.internal:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-task_manager}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
